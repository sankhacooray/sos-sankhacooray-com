<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:630px}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;background:#D32F2F;color:#fff;display:grid;grid-template-columns:1.1fr 1fr;gap:56px;padding:72px 80px;align-items:center;overflow:hidden}
.ey{font-size:20px;font-weight:700;letter-spacing:4px;text-transform:uppercase;opacity:.85}
h1{font-size:84px;font-weight:900;line-height:1.02;letter-spacing:-1px;margin:22px 0 22px}
p{font-size:26px;line-height:1.4;opacity:.92;max-width:520px}
.pills{display:flex;gap:16px;margin-top:34px}
.pill{background:#fff;color:#B71C1C;border-radius:999px;padding:12px 28px;display:flex;flex-direction:column;align-items:center;line-height:1.05}
.pill small{font-size:13px;font-weight:600;color:#8E2424}
.pill b{font-size:34px;font-weight:900}
.ui{background:#fff;border-radius:22px;padding:26px;color:#1a1a1a;box-shadow:0 40px 80px -30px rgba(0,0,0,.45);display:grid;gap:16px}
.id{background:#FFEBEE;border:2px solid #D32F2F;border-radius:14px;padding:18px;text-align:center}
.bar{height:16px;border-radius:8px;background:#f1c9cc;margin:0 auto}
.blood{display:inline-block;margin-top:12px;background:#D32F2F;color:#fff;border-radius:8px;padding:6px 20px;font-weight:900;font-size:22px;letter-spacing:2px}
.sec{background:#f6f3f3;border-radius:12px;padding:14px 16px}
.sec .h{font-size:13px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#555;margin-bottom:10px}
.r{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.r i{display:block;height:12px;border-radius:6px;background:#ddd}
.call{background:#2E7D32;color:#fff;border-radius:999px;padding:6px 16px;font-weight:700;font-size:15px}
</style></head><body>
<div>
  <div class="ey">⚕ SOS · first responders</div>
  <h1>Medical emergency info</h1>
  <p>Blood type, allergies, medications and contacts on one screen, picked for where you are.</p>
  <div class="pills"><div class="pill"><small>SG Ambulance</small><b>995</b></div><div class="pill"><small>LK Suwa Seriya</small><b>1990</b></div></div>
</div>
<div class="ui">
  <div class="id"><div class="bar" style="width:60%"></div><div class="bar" style="width:40%;height:10px;margin-top:10px;background:#e8d6d8"></div><div class="blood">BLOOD TYPE</div></div>
  <div class="sec"><div class="h">⚠ Allergies</div><div class="r"><i style="width:55%"></i></div></div>
  <div class="sec"><div class="h">Emergency contacts</div><div class="r"><i style="width:45%"></i><span class="call">Call</span></div><div class="r"><i style="width:38%"></i><span class="call">Call</span></div></div>
</div>
</body></html>
